<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Interação com o Mouse</title>
</head>

<body>

    <canvas id="canvas" width="600" height="600"></canvas>

    <div>
        <p id="canvasCoordinates">
            Canvas: (300, 300)
        </p>

        <p id="webglCoordinates">
            WebGL: (0.000, 0.000)
        </p>

        <p id="modeDisplay">
            Modo: LINHAS (2 pontos)
        </p>

        <p>
            <strong>Controles:</strong><br>
            Pressione <strong>L</strong> para modo LINHAS<br>
            Pressione <strong>T</strong> para modo TRIÂNGULOS<br>
            Pressione <strong>C</strong> para limpar o canvas
        </p>

    <script src="main.js"></script>

</body>
</html>
